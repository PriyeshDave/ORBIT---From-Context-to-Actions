services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orbit-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - orbit-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Left blank on purpose: the frontend then makes same-origin
      # requests (e.g. /api/login), and nginx (see nginx.conf) forwards
      # them to the backend container - this works no matter what IP or
      # domain the app ends up served from. Only set these two in your
      # root .env if you specifically need the frontend to call a backend
      # on a different origin than the one serving the page.
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
    container_name: orbit-frontend
    ports:
      - "${FRONTEND_PORT:-80}:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - orbit-net

networks:
  orbit-net:
    driver: bridge

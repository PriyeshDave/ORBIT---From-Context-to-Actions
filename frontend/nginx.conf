# Needed so a plain HTTP request (Connection: close/keep-alive) isn't
# forced through the WebSocket upgrade path - only requests that actually
# ask to upgrade get "Connection: upgrade" forwarded to the backend.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Frontend static app (client-side routing - always fall back to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # All backend REST endpoints, proxied same-origin so the frontend
    # never needs to know its own public IP/domain in advance.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade support (Readiness's live chat) - harmless for
        # plain HTTP requests, only triggers when the client actually asks
        # to upgrade the connection.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Server-Sent Events (Catch Up's and Daily Plan's live pipeline
        # streams) need buffering off and a generous read timeout so a
        # slow LLM call doesn't get cut off mid-stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
